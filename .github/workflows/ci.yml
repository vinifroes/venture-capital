name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build JSON documents from Markdown
        env:
          SOURCE_DATE_EPOCH: "0"
        run: npm run documents:build

      - name: Verify generated JSON files are up-to-date
        run: git diff --exit-code -- src/documents_json src/documents_json/index.json

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
